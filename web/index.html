<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写字预约 - 管理后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">
                <span class="logo-lines">
                    <span class="logo-line"></span>
                    <span class="logo-line"></span>
                    <span class="logo-line"></span>
                </span>
            </div>
            <div class="logo-text">
                <h1 class="brand-name">写字预约</h1>
                <span class="brand-sub">管理后台</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <div class="menu-item" data-menu="workbench" onclick="switchMenu('workbench')">
                <span class="menu-icon menu-icon-workbench">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                        <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                        <rect x="3" y="16" width="7" height="5" rx="1.5"/>
                    </svg>
                </span>
                <span class="menu-label">工作台</span>
                <span class="menu-badge" id="workbenchBadge" style="display:none;">0</span>
            </div>
            <div class="menu-item active" data-menu="home" onclick="switchMenu('home')">
                <span class="menu-icon menu-icon-home">
                    <span class="mi-house"></span>
                </span>
                <span class="menu-label">订单管理</span>
            </div>
        </nav>

        <div class="sidebar-footer">
            <button class="sidebar-action-btn" onclick="showNotifications()" title="通知">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span>通知</span>
                <span class="notify-badge" id="notifyBadge" style="display:none;">0</span>
            </button>
            <button class="sidebar-action-btn logout" onclick="handleLogout()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>退出登录</span>
            </button>
            <div class="admin-profile">
                <div class="admin-avatar">
                    <span class="avatar-person"></span>
                </div>
                <div class="admin-info">
                    <span class="admin-name">管理员</span>
                    <span class="admin-role">admin</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content-wrapper">
        <!-- 内容区域 -->
        <div class="content-area">
            <!-- 信息栏：日期+今日订单 -->
            <div class="info-bar">
                <div class="info-bar-right">
                    <span class="info-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span id="currentDate"></span>
                    </span>
                    <span class="info-divider"></span>
                    <span class="info-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        <span>今日订单</span>
                        <strong class="today-count" id="todayCount">0</strong>
                        <span>笔</span>
                    </span>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-row" id="statsRow"></div>

            <!-- 筛选+搜索+导出 -->
            <div class="filter-bar">
                <div class="filter-tabs" id="filterTabs"></div>
                <div class="filter-actions">
                    <div class="search-wrap">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" class="search-input" id="searchInput" placeholder="搜索客户名/文件名/订单号" oninput="handleSearch(this.value)">
                    </div>
                    <button class="export-btn" onclick="exportCSV()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span>导出</span>
                    </button>
                </div>
            </div>

            <!-- 订单表格 -->
            <div class="orders-table-wrap">
                <table class="orders-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th class="col-check">
                                <label class="checkbox-wrap">
                                    <input type="checkbox" id="checkAll" onchange="toggleSelectAll(this.checked)">
                                    <span class="checkmark"></span>
                                </label>
                            </th>
                            <th>时间</th>
                            <th>客户</th>
                            <th>文件</th>
                            <th>金额</th>
                            <th>截图</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTbody"></tbody>
                </table>
                <div class="table-empty" id="tableEmpty" style="display:none;">
                    <div class="empty-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <p>暂无订单数据</p>
                </div>
            </div>

            <!-- 分页 -->
            <div class="pagination-bar" id="paginationBar"></div>
        </div>

        <!-- 工作台视图 -->
        <div class="workbench-view" id="workbenchView" style="display:none;">
            <!-- 顶栏 -->
            <div class="workbench-topbar">
                <div class="workbench-title-wrap">
                    <h2 class="workbench-title">工作台</h2>
                    <span class="workbench-sub">逐个快速处理待办订单</span>
                </div>
                <div class="workbench-progress" id="wbProgress"></div>
                <button class="btn btn-default" onclick="switchMenu('home')">返回订单管理</button>
            </div>

            <!-- 队列筛选 -->
            <div class="wb-filter" id="wbFilter">
                <button class="wb-filter-btn active" data-wf="confirm" onclick="wbSetFilter('confirm')">待确认<span class="wb-filter-count" id="wfCountConfirm">0</span></button>
                <button class="wb-filter-btn" data-wf="pending" onclick="wbSetFilter('pending')">待处理<span class="wb-filter-count" id="wfCountPending">0</span></button>
                <button class="wb-filter-btn" data-wf="doing" onclick="wbSetFilter('doing')">书写中<span class="wb-filter-count" id="wfCountDoing">0</span></button>
            </div>

            <!-- 主体：三栏（左侧待办列表 | 中间订单信息+操作 | 右侧转账截图） -->
            <div class="workbench-main">
                <!-- 左侧：待办队列 -->
                <div class="wb-queue-card">
                    <div class="wb-card-title-row">
                        <span class="wb-card-title">待办列表</span>
                    </div>
                    <div class="wb-queue-bar" id="wbQueueBar"></div>
                </div>

                <!-- 中间：订单信息 + 操作 -->
                <div class="workbench-side">
                    <div class="wb-card wb-info-card">
                        <div class="wb-card-title">订单信息</div>
                        <div class="wb-info-rows" id="wbInfoRows"></div>
                        <div class="wb-file" id="wbFile" style="display:none;"></div>
                    </div>
                    <div class="wb-card wb-actions-card">
                        <div class="wb-actions">
                            <button class="btn btn-primary wb-main-btn" id="wbMainBtn" onclick="wbMainAction()">确认收款</button>
                        </div>
                    </div>
                </div>

                <!-- 右侧：内嵌大图（按图片比例伸缩窗口） -->
                <div class="wb-card wb-proof-card">
                    <div class="wb-card-title">转账截图</div>
                    <div class="wb-proof-body">
                        <img id="wbProofImg" class="wb-proof-img" onclick="previewPaymentProof(this)" alt="转账截图" style="display:none;"/>
                        <div id="wbProofEmpty" class="wb-proof-empty" style="display:none;">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <p>该订单未上传转账截图</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 批量操作栏 -->
    <div class="bulk-bar" id="bulkBar">
        <div class="bulk-info">
            <span class="bulk-selected" id="bulkSelectedCount">已选 0 项</span>
            <button class="bulk-clear" onclick="clearSelection()">取消选择</button>
        </div>
        <div class="bulk-actions">
            <select class="bulk-status-select" id="bulkStatusSelect" onchange="if(this.value) bulkChangeStatus()">
                <option value="">批量修改状态</option>
                <option value="pending">设为待处理</option>
                <option value="doing">设为进行中</option>
                <option value="done">设为已完成</option>
                <option value="cancelled">设为已取消</option>
            </select>
            <button class="bulk-btn bulk-btn-paid" onclick="bulkConfirmPayment()">批量确认收款</button>
            <button class="bulk-btn bulk-btn-danger" onclick="bulkDelete()">批量删除</button>
        </div>
    </div>

    <!-- Mobile menu FAB -->
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <span class="hamburger-lines">
            <span></span><span></span><span></span>
        </span>
    </button>

    <!-- Loading遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- 订单详情弹窗 -->
    <div class="modal-overlay" id="detailModal" onclick="closeDetailModal(event)">
        <div class="modal-container detail-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="detailOrderNo"></h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
            <div class="modal-footer" id="detailFooter"></div>
        </div>
    </div>

    <!-- 通知弹窗 -->
    <div class="notification-modal" id="notificationModal">
        <div class="notification-header">
            <h4>通知</h4>
            <button class="modal-close" onclick="closeNotifications()">&times;</button>
        </div>
        <div class="notification-body" id="notificationBody">
            <div class="notification-empty">暂无新通知</div>
        </div>
        <div class="notification-footer">
            <button class="btn btn-primary" onclick="markAllRead()">全部已读</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js?v=38"></script>
</body>
</html>
